name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # Это разрешает создание релизов
  packages: write  # Если публикуете в GitHub Packages

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: ubuntu-latest
            args: ""
          - platform: macos-latest
            args: ""
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve release notes from CHANGELOG
        shell: bash
        run: |
          python <<'PY'
          import os
          import pathlib
          import re
          import sys

          changelog_path = pathlib.Path("CHANGELOG.md")
          tag_name = os.environ.get("GITHUB_REF_NAME", "").strip()
          version = tag_name[1:] if tag_name.startswith("v") else tag_name
          release_name = f"Flowmode {tag_name}"
          fallback_body = (
              "Release description not found in CHANGELOG.md.\n\n"
              f"Add a section `## [{version}]` and repeat the release."
          )

          body = fallback_body
          if changelog_path.exists():
              text = changelog_path.read_text(encoding="utf-8")
              lines = text.splitlines()
              pattern = re.compile(
                  rf"^##\s+\[?v?{re.escape(version)}\]?(?:\s+-\s+.*)?\s*$",
                  re.IGNORECASE,
              )
              start_idx = -1
              for idx, line in enumerate(lines):
                  if pattern.match(line.strip()):
                      start_idx = idx + 1
                      break

              if start_idx != -1:
                  end_idx = len(lines)
                  for idx in range(start_idx, len(lines)):
                      if re.match(r"^##\s+", lines[idx].strip()):
                          end_idx = idx
                          break
                  section = "\n".join(lines[start_idx:end_idx]).strip()
                  if section:
                      body = section

          env_file = os.environ["GITHUB_ENV"]
          with open(env_file, "a", encoding="utf-8") as f:
              f.write(f"RELEASE_NAME={release_name}\n")
              f.write("RELEASE_BODY<<EOF\n")
              f.write(body)
              f.write("\nEOF\n")
          PY

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libgdk-pixbuf2.0-dev pkg-config

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ env.RELEASE_NAME }}
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
